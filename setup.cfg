[bdist_wheel]
universal = 0

[metadata]
requires_dist =
    python-dateutil>=2.1,<3.0.0
    jmespath>=0.7.1,<1.0.0
    urllib3>=1.25.4,<1.27

[options.extras_require]
crt = awscrt==0.11.24

[check-manifest]
ignore =
    .github
    .github/*
    .dependabot
    .dependabot/*
    .codecov.yml
    .coveragerc
    CHANGELOG.rst
    CODE_OF_CONDUCT.md
    CONTRIBUTING.md
    .travis.yml
    requirements-check.txt
    requirements-dev-lock.txt
    requiremnts-doc.txt
    tox.ini
    .changes
    .changes/*
    tests
    tests/*
    scripts
    scripts/*
    doc
    doc/*
